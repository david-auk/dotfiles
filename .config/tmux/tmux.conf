set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB,*:Ss=\E[%p1%d q,*:Se=\E[2 q"
set -as terminal-features ",ghostty:RGB"
set -as terminal-features ",xterm*:RGB"
set -g mouse on
set -g escape-time 0  # disable delays on escape sequences

unbind r
bind r source-file ~/.config/tmux/tmux.conf

unbind C-b
# set -g prefix C-Space
set -g prefix C-a
bind C-Space send-prefix

# Shift alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Closing behaviour
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
bind-key b set-option status

# Reuse the active SSH connection when creating panes/windows.
set -g @ssh-split-keep-cwd "true"
set -g @ssh-split-strip-cmd "true"
set -g @ssh-split-keep-remote-cwd "true"

# Prefix + s -> top/bottom split
# Prefix + v -> side-by-side split
# Prefix + c -> new window
set -g @ssh-split-v-key "s"
set -g @ssh-split-h-key "v"
set -g @ssh-split-w-key "c"

set -g @plugin "pschmitt/tmux-ssh-split"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

# Custom plugins
set -g @plugin "david-auk/tmux-vim-copy-mode"

#set -g status-position top
set -g @minimal-tmux-status "top"

set -g status-interval 30

# Keep the window list in the actual center of the terminal,
# independent of the session name/status icon widths.
set -g @minimal-tmux-justify "absolute-centre"

# Use the theme's original left-side implementation.
#
# This unset is important: tmux retains user options when the corresponding
# line is removed from tmux.conf, so the old @minimal-tmux-status-left '#S'
# override otherwise keeps disabling the prefix indicator.
set -gu @minimal-tmux-status-left
set -g @minimal-tmux-left true
set -g @minimal-tmux-indicator true
set -g @minimal-tmux-indicator-str " #S "
set -g status-left-length 100

# The script includes its own leading space only when an indicator is shown.
set -g @minimal-tmux-status-right '#(~/.config/tmux/scripts/meeting-status)'
set -g status-right-length 20

# Toggleable window numbers.
set -g @show-window-index off

set -g @minimal-tmux-window-status-format \
  ' #{?#{==:#{@show-window-index},on},#I:,}#W '

bind n if-shell -F '#{==:#{@show-window-index},on}' \
  'set -g @show-window-index off; refresh-client -S' \
  'set -g @show-window-index on; refresh-client -S'

# Make boxes rounded
set -g @minimal-tmux-use-arrow true
set -g @minimal-tmux-right-arrow ""
set -g @minimal-tmux-left-arrow ""

# Inactive windows
set -g window-status-style "fg=#6c7086,bg=default"

# Current window
set -g window-status-current-style "fg=#ffffff,bg=default"

bind -n M-l send-keys C-l

set-window-option -g mode-keys vi
setw -g mode-keys vi

# Do not let vim-tmux-navigator claim prefix + C-l.
# it is used by my sesh latest binding below
set -g @vim_navigator_prefix_mapping_clear_screen ""

# Sesh navigation
bind-key C-k run-shell -b "~/.config/sesh/scripts/sesh_picker"
bind-key -N "last-session (via sesh)" C-l run-shell "sesh last"

# Display popups

bind C-g display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"

# Signal massaging
bind C-s new-pane \
  -x 80% \
  -y 80% \
  -X 10% \
  -Y 10% \
 "EDITOR=nvim gurk"
bind C-n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind C-m new-pane \
  -x 80% \
  -y 80% \
  -X 10% \
  -Y 10% \
  'rmpc'
bind C-t display-popup \
  -d "#{pane_current_path}" \
  -w 75% \
  -h 75% \
  -E "zsh"
bind C-c display-popup \
  -w 75% \
  -h 60% \
  -E "~/.config/tmux/scripts/meeting-popup"

##### Pane resizing #####

# Fine resize: prefix + H/J/K/L
bind H resize-pane -L 2
bind J resize-pane -D 2
bind K resize-pane -U 2
bind L resize-pane -R 2

# Rough resize: prefix + h/j/k/l
bind h resize-pane -L 10
bind j resize-pane -D 10
bind k resize-pane -U 10
bind l resize-pane -R 10

run '~/.tmux/plugins/tmp/tmp'
